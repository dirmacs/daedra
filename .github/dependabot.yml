version: 2
updates:
  # Cargo dependencies. The CI audit gate (cargo-audit) blocks releases on
  # new advisories, so early bumps keep releases unblocked.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  # GitHub Actions versions (checkout, upload-artifact, buildx, ...).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
